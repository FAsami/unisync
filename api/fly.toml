# Fly.io app for the .NET API. See CUTOVER.md for first-time setup.
# Secrets (set with `fly secrets set -a unisync-api ...`, never committed):
#   ConnectionStrings__Default   Npgsql connection string to the production Postgres
#   Auth__JwtSecret              same value the Node server used (keeps sessions valid)
#   Sms__ApiKey, Sms__SecretKey, Sms__CallerId   BulkSMSBD
#   Push__FcmServiceAccountJson  Firebase service-account JSON (raw or base64)
#   Push__Enabled                'true' from CUTOVER.md step 5
app = 'unisync-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  # Applies db/migrations before the new version takes traffic. The image's
  # entrypoint is `dotnet UniSync.Api.dll`; Program.cs looks for "migrate" in
  # its arguments, so this works whether or not Fly keeps the entrypoint.
  release_command = 'dotnet UniSync.Api.dll migrate'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  Campus__TimeZone = 'Asia/Dhaka'
  Sms__Provider = 'bulksmsbd'
  # Push delivery stays off (appsettings default) until CUTOVER.md step 5, when
  # it is switched on with `fly secrets set Push__Enabled=true`. Turning it on
  # while Hasura's event trigger still runs pushes every notification twice.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/v1/health/ready'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
