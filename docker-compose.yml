# Local development: Postgres, and optionally the API in a container.
#   docker-compose up -d postgres         # then: cd api && dotnet run --project src/UniSync.Api
#   docker-compose up -d                  # Postgres + the API on http://localhost:9202
# Sign-in codes print to the API's log in Development (docker-compose logs -f api).
services:
  postgres:
    image: postgres:17.5
    container_name: unisync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unisync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "9200:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: unisync-api
    restart: unless-stopped
    # Applies migrations, then serves. Development settings only: never use these values in production.
    entrypoint: ["sh", "-c", "dotnet UniSync.Api.dll migrate && exec dotnet UniSync.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=unisync;Username=postgres;Password=postgrespassword
      Auth__JwtSecret: local-development-secret-at-least-32-characters
      Sms__Provider: console
    ports:
      - "9202:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
