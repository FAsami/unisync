name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:9201/api/v1
      NEXT_PUBLIC_HASURA_ENDPOINT: http://localhost:9203/v1/graphql
      ENCRYPT_SECRET: ci-only-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn format:check
      - run: yarn build

  mobile:
    name: Mobile (lint, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mobile/yarn.lock
      # Native build steps (pods, gradle) are not needed to lint/typecheck.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test --ci
      # The typed API client must match the committed API contract.
      - name: API types are up to date
        run: |
          yarn api:types
          git diff --exit-code -- lib/api/generated.ts || { echo "Run: cd mobile && yarn api:types"; exit 1; }

  api:
    name: API (.NET build, test, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UNISYNC_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
      # A missing database fails the job instead of silently skipping tests.
      UNISYNC_REQUIRE_DB: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: docker build -t unisync-api .

  migrations:
    name: Migration guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-migrations.py
